<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notification</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f6f9fc; margin:0; padding:20px; }
      .card { background:#fff; border-radius:8px; padding:20px; max-width:600px; margin:0 auto; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
      .header { font-size:20px; font-weight:700; margin-bottom:10px; color:#333; }
      .content { font-size:14px; color:#555; line-height:1.5; }
      .footer { margin-top:20px; font-size:12px; color:#999; }
      .btn { display:inline-block; margin-top:16px; padding:10px 16px; background:#0066ff; color:#fff; border-radius:6px; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">Notification</div>
      <div class="content">
        <p>Hello,</p>
        <p>This is a notification email. You can customize this template in index.html or send a custom HTML in the API request body (property: html).</p>
        <a class="btn" href="#">View Details</a>
        <p class="footer">If you did not expect this email, please ignore it.</p>
      </div>
    </div>
  </body>
</html>
